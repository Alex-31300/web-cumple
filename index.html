<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#020204">
<title>Flores Amarillas 🌻</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020204}
body{font-family:Georgia,"Times New Roman",serif;color:#fff;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%}

#intro{
  position:fixed;inset:0;z-index:5;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  /* El fondo ahora es semitransparente para ver las estrellas de fondo */
  background:
    radial-gradient(circle at 50% 44%,rgba(255,194,0,.15),transparent 35%),
    radial-gradient(circle at 50% 100%,rgba(255,174,0,.08),transparent 45%);
  transition:1s ease;
}
#intro.hide{opacity:0;pointer-events:none}

#intro h1{
  margin:0 0 22px;
  font-size:clamp(24px,7vw,42px);
  letter-spacing:.1em;text-transform:uppercase;
  color:#ffe36b;text-shadow:0 0 24px rgba(255,194,0,.55);
  text-align:center;
}

#flower{
  width:min(190px,52vw);height:min(190px,52vw);
  position:relative;border:0;background:none;
  animation:float 3s ease-in-out infinite;
  filter:drop-shadow(0 0 25px rgba(217,157,25,.55));
  cursor:pointer;
}
@keyframes float{50%{transform:translateY(-10px) rotate(2deg)}}

.p{
  position:absolute;width:40%;height:62%;left:30%;top:19%;
  border-radius:55%;
  background:radial-gradient(circle at 40% 25%,#fff4a0,#ffd21c 28%,#d89000);
  box-shadow:inset -7px -9px 14px rgba(113,67,0,.23);
  transform-origin:50% 85%;
}
.p:nth-child(1){transform:rotate(0deg) translateY(-27%)}
.p:nth-child(2){transform:rotate(45deg) translateY(-27%)}
.p:nth-child(3){transform:rotate(90deg) translateY(-27%)}
.p:nth-child(4){transform:rotate(135deg) translateY(-27%)}
.p:nth-child(5){transform:rotate(180deg) translateY(-27%)}
.p:nth-child(6){transform:rotate(225deg) translateY(-27%)}
.p:nth-child(7){transform:rotate(270deg) translateY(-27%)}
.p:nth-child(8){transform:rotate(315deg) translateY(-27%)}

.center{
  position:absolute;
  left:50%;top:71.7%;
  width:34%;height:34%;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:radial-gradient(circle at 35% 28%,#b97a19 0 9%,#8d5510 25%,#492504 72%,#2b1201 100%);
  box-shadow:0 0 26px rgba(229,169,29,.62),inset -8px -10px 13px rgba(0,0,0,.25);
  z-index:4;
}

.hint{
  margin-top:8px;
  font:12px Arial,sans-serif;letter-spacing:.18em;color:#aaa;
  text-transform:uppercase;animation:pulse 2s infinite;
}
@keyframes pulse{50%{opacity:.35}}

#message{
  position:fixed;z-index:3;left:50%;
  bottom:max(20px,env(safe-area-inset-bottom));
  transform:translateX(-50%);
  width:92%;max-width:660px;
  text-align:center;opacity:0;transition:1.1s;
  pointer-events:none;text-shadow:0 2px 12px #000;
}
#message.show{opacity:1}
#message .card{
  padding:14px 16px 12px;border-radius:22px;
  background:linear-gradient(to bottom,rgba(5,5,7,.08),rgba(5,5,7,.72));
  border:1px solid rgba(255,214,73,.14);
  backdrop-filter:blur(2px);
}
#message h2{
  font-size:clamp(24px,7vw,44px);color:#ffe16b;
  margin:0 0 7px;
}
#message p{
  font-size:clamp(14px,3.8vw,19px);
  line-height:1.42;margin:0;color:#eee;
}
#message small{
  display:block;margin-top:10px;
  font:10px Arial,sans-serif;letter-spacing:.16em;color:#ffd21c;
}

#tip{
  position:fixed;z-index:4;top:15px;left:50%;
  transform:translateX(-50%);
  font:11px Arial;color:#bbb;opacity:0;transition:1s;
  text-align:center;white-space:nowrap;
}
#tip.show{opacity:.85}

#reset{
  position:fixed;z-index:4;right:14px;top:14px;
  padding:8px 11px;border-radius:20px;
  border:1px solid #8d6d20;background:#090909aa;
  color:#ffe16b;font:11px Arial;opacity:0;transition:1s;
}
#reset.show{opacity:1}
</style>
</head>
<body>
<canvas id="scene"></canvas>

<section id="intro">
  <h1>Para Lucero 🌻</h1>
  <button id="flower" aria-label="Tocar la flor">
    <i class="p"></i><i class="p"></i><i class="p"></i><i class="p"></i>
    <i class="p"></i><i class="p"></i><i class="p"></i><i class="p"></i>
    <i class="center"></i>
  </button>
  <div class="hint">Toca la flor</div>
</section>

<div id="tip">ARRASTRA PARA GIRAR · PINZA PARA ACERCAR</div>
<button id="reset">↻ Reiniciar</button>

<div id="message">
  <div class="card">
    <h2>¡Hola Lucero! 🌻</h2>
    <p>“Un pequeño detalle amarillo porque sí. Espero que estés teniendo un buen día y que te vaya genial en todo.”</p>
    <small>GIRA EL RAMO · ACERCA LA PANTALLA</small>
  </div>
</div>

<script>
(() => {
  const canvas=document.getElementById('scene');
  const ctx=canvas.getContext('2d');

  const intro=document.getElementById('intro');
  const flower=document.getElementById('flower');
  const msg=document.getElementById('message');
  const tip=document.getElementById('tip');
  const reset=document.getElementById('reset');

  let W=innerWidth,H=innerHeight,dpr=1;
  let active=false, rx=.10, ry=0, zoom=1;
  let dragging=false,lastX=0,lastY=0,pinchStart=0;
  let introTime=0;

  const flowers=[];
  const stars=[];

  function resize(){
    dpr=Math.min(devicePixelRatio||1,2);
    W=innerWidth; H=innerHeight;
    canvas.width=W*dpr; canvas.height=H*dpr;
    canvas.style.width=W+'px'; canvas.style.height=H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  addEventListener('resize',resize);
  resize();

  for(let i=0;i<850;i++){
    const a=Math.random()*Math.PI*2;
    const r=10+Math.random()*33;
    stars.push({
      x:Math.cos(a)*r,
      y:(Math.random()-.5)*25,
      z:Math.sin(a)*r,
      tw:Math.random()*6.28
    });
  }

  const COUNT=76;
  for(let i=0;i<COUNT;i++){
    const layer=i/COUNT;
    const spread=(Math.random()<.55 ? 0.72 : 1.0);
    const x=(Math.random()*2-1)*4.9*spread;
    
    const y=2.2+(Math.random()*2.0)-Math.abs(x)*.16; 
    
    const z=(Math.random()-0.5)*4.6;

    flowers.push({
      x,y,z,
      s:0.34+Math.random()*0.30 + (z>1 ? .05 : 0),
      rot:Math.random()*Math.PI*2,
      phase:Math.random()*6.28,
      delay:(i/COUNT)*.85,
      bloom:0,
      stemBias:(Math.random()-.5)*.9,
      leafL:Math.random()>.42,
      leafR:Math.random()>.46
    });
  }

  function rotatePoint(p){
    const cy=Math.cos(ry),sy=Math.sin(ry);
    let x=p.x*cy-p.z*sy;
    let z=p.x*sy+p.z*cy;

    const cx=Math.cos(rx),sx=Math.sin(rx);
    let y=p.y*cx-z*sx;
    z=p.y*sx+z*cx;

    return {x,y,z};
  }

  function project(p){
    const focal=500*zoom;
    const d=13+p.z;
    return {
      x:W/2+p.x*focal/d,
      y:H/2-p.y*focal/d,
      z:p.z,
      scale:focal/d
    };
  }

  function drawStar(s){
    const p=rotatePoint(s), q=project(p);
    if(q.z<-12 || q.z>40)return;
    const a=.35+.45*(.5+.5*Math.sin(performance.now()*.0015+s.tw));
    const r=Math.max(.35,1.6-q.z*.03);
    ctx.fillStyle='rgba(255,226,139,'+a+')';
    ctx.beginPath();ctx.arc(q.x,q.y,r,0,Math.PI*2);ctx.fill();
  }

  function drawLeaf(x,y,scale,angle,alpha){
    ctx.save();
    ctx.translate(x,y);ctx.rotate(angle);
    const g=ctx.createLinearGradient(-scale,0,scale,0);
    g.addColorStop(0,'#234512');g.addColorStop(.52,'#6c982f');g.addColorStop(1,'#2f5c18');
    ctx.globalAlpha=alpha;
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.bezierCurveTo(scale*.55,-scale*.85,scale*1.25,-scale*.55,scale*1.42,0);
    ctx.bezierCurveTo(scale*.92,scale*.52,scale*.4,scale*.5,0,0);
    ctx.fill();
    ctx.strokeStyle='rgba(173,207,93,.45)';
    ctx.lineWidth=Math.max(.7,scale*.08);
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(scale*1.28,-scale*.03);ctx.stroke();
    ctx.restore();
  }

  function drawFlower(f,t){
    const rp=rotatePoint({
      x:f.x+Math.sin(t*.22+f.phase)*.08,
      y:f.y+Math.sin(t*.75+f.phase)*.11,
      z:f.z
    });
    const q=project(rp);
    if(q.z<-11)return;

    const depth=Math.max(.5,Math.min(1.5,1.0-rp.z*.025));
    const size=q.scale*f.s*1.34*f.bloom*depth;
    if(size<.5)return;

    const base3D=rotatePoint({
      x:f.stemBias*.8,
      y:-4.8,
      z:rp.z*.28
    });
    const b=project(base3D);

    const sway=Math.sin(t*.8+f.phase)*size*.07;
    const fx=q.x, fy=q.y;
    const midX=(fx+b.x)/2+sway;
    const midY=(fy+b.y)/2;

    ctx.save();

    const stemGrad=ctx.createLinearGradient(fx,fy,b.x,b.y);
    stemGrad.addColorStop(0,'#709c2e');
    stemGrad.addColorStop(.55,'#4f7c23');
    stemGrad.addColorStop(1,'#294815');
    ctx.strokeStyle=stemGrad;
    ctx.lineWidth=Math.max(1, size*.11);
    ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(b.x,b.y);
    ctx.quadraticCurveTo(midX,midY,fx,fy+size*.18);
    ctx.stroke();

    const leafSize=Math.max(3.2,size*.62);
    if(f.leafL) drawLeaf(
      fx+(b.x-fx)*.48, fy+(b.y-fy)*.48,
      leafSize, -1.15+f.rot*.03, .88
    );
    if(f.leafR) drawLeaf(
      fx+(b.x-fx)*.66, fy+(b.y-fy)*.66,
      leafSize*.9, .72+f.rot*.03, .82
    );

    ctx.fillStyle='#466f1e';
    for(let i=0;i<7;i++){
      ctx.save();
      ctx.translate(fx,fy);
      ctx.rotate(i*Math.PI/3.5+f.rot);
      ctx.beginPath();
      ctx.moveTo(0,size*.16);
      ctx.lineTo(size*.10,size*.52);
      ctx.lineTo(size*.02,size*.27);
      ctx.lineTo(-size*.08,size*.48);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    ctx.translate(fx,fy);
    ctx.rotate(f.rot+Math.sin(t*.35+f.phase)*.06);
    ctx.globalAlpha=Math.max(.1,Math.min(1,f.bloom));

    for(let i=0;i<12;i++){
      ctx.save();
      ctx.rotate(i*Math.PI/6);
      const petalScale=size*(.88+.08*Math.sin(t*1.5+f.phase+i));
      const grad=ctx.createRadialGradient(
        -petalScale*.08,-petalScale*.42,0,
        0,0,petalScale*.74
      );
      grad.addColorStop(0,'#fff5a5');
      grad.addColorStop(.22,'#ffe13c');
      grad.addColorStop(.72,'#f5b900');
      grad.addColorStop(1,'#c77a00');
      ctx.fillStyle=grad;
      ctx.beginPath();
      ctx.ellipse(0,-petalScale*.50,petalScale*.22,petalScale*.53,0,0,Math.PI*2);
      ctx.fill();
      ctx.restore();
    }

    const center=size*.32;
    const cg=ctx.createRadialGradient(-center*.32,-center*.4,0,0,0,center);
    cg.addColorStop(0,'#c2851d');
    cg.addColorStop(.25,'#8d5510');
    cg.addColorStop(.72,'#4b2505');
    cg.addColorStop(1,'#251001');
    ctx.fillStyle=cg;
    ctx.beginPath();ctx.arc(0,0,center,0,Math.PI*2);ctx.fill();

    ctx.fillStyle='rgba(255,229,126,.14)';
    ctx.beginPath();ctx.arc(-center*.22,-center*.22,center*.18,0,Math.PI*2);ctx.fill();

    ctx.restore();
  }

  function frame(now){
    const t=now*.001;
    ctx.fillStyle='#020204';
    ctx.fillRect(0,0,W,H);

    // Fondo brillante estrellado siempre visible
    const neb=ctx.createRadialGradient(
      W/2,H*.46,0,W/2,H*.46,Math.max(W,H)*.72
    );
    neb.addColorStop(0,'rgba(117,78,5,.18)');
    neb.addColorStop(.46,'rgba(34,24,4,.10)');
    neb.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=neb;
    ctx.fillRect(0,0,W,H);

    // Movimiento lento del espacio antes de tocar la flor
    if(!active) {
      ry += 0.001;
    }

    // Las estrellas se dibujan en todo momento
    stars.forEach(drawStar);

    if(active){
      for(const f of flowers){
        const local=Math.max(0,Math.min(1,(t-introTime-f.delay)/.95));
        f.bloom=1-Math.pow(1-local,3);
      }

      const sorted=flowers.slice().sort((a,b)=>rotatePoint(a).z-rotatePoint(b).z);
      sorted.forEach(f=>drawFlower(f,t));

      const baseY=H-35;
      const baseX=W/2;
      const grad=ctx.createRadialGradient(baseX,baseY,1,baseX,baseY,100);
      grad.addColorStop(0,'rgba(106,75,15,.55)');
      grad.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=grad;
      ctx.beginPath();ctx.arc(baseX,baseY,100,0,Math.PI*2);ctx.fill();
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function start(){
    if(active)return;
    active=true;
    introTime=performance.now()*.001;
    intro.classList.add('hide');
    msg.classList.add('show');
    tip.classList.add('show');
    reset.classList.add('show');
    setTimeout(()=>tip.classList.remove('show'),4500);
  }

  flower.addEventListener('click',start);
  flower.addEventListener('touchend',e=>{
    e.preventDefault();start();
  },{passive:false});

  canvas.addEventListener('pointerdown',e=>{
    if(!active)return;
    dragging=true;lastX=e.clientX;lastY=e.clientY;
  });

  addEventListener('pointermove',e=>{
    if(!dragging||!active)return;
    ry+=(e.clientX-lastX)*.008;
    rx+=(e.clientY-lastY)*.006;
    rx=Math.max(-1.0,Math.min(1.0,rx));
    lastX=e.clientX;lastY=e.clientY;
  });

  addEventListener('pointerup',()=>dragging=false);

  canvas.addEventListener('wheel',e=>{
    if(!active)return;
    e.preventDefault();
    zoom*=Math.exp(-e.deltaY*.001);
    zoom=Math.max(.72,Math.min(1.75,zoom));
  },{passive:false});

  canvas.addEventListener('touchstart',e=>{
    if(!active)return;
    if(e.touches.length===2){
      pinchStart=Math.hypot(
        e.touches[0].clientX-e.touches[1].clientX,
        e.touches[0].clientY-e.touches[1].clientY
      );
    }
  },{passive:false});

  canvas.addEventListener('touchmove',e=>{
    if(!active)return;
    e.preventDefault();
    if(e.touches.length===2){
      const d=Math.hypot(
        e.touches[0].clientX-e.touches[1].clientX,
        e.touches[0].clientY-e.touches[1].clientY
      );
      if(pinchStart){
        zoom*=d/pinchStart;
        zoom=Math.max(.72,Math.min(1.75,zoom));
        pinchStart=d;
      }
    }
  },{passive:false});

  reset.onclick=()=>location.reload();
})();
</script>
</body>
</html>
